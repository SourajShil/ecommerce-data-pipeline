version: 2

models:
  - name: fct_daily_sales
    description: "Daily aggregated sales metrics"
    columns:
      - name: sale_date
        tests: [unique, not_null]
      - name: total_revenue
        tests: [not_null]

  - name: fct_product_performance
    description: "Product sales with category ranking"
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: units_sold
        tests: [not_null]

  - name: fct_customer_rfm
    description: "Customer RFM segmentation"
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_segment
        tests:
          - accepted_values:
              values: ["Champion", "Loyal", "At Risk", "Lost"]
